<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sample SCORM 1.2 Course</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; }
  .q { margin: 16px 0; } button { padding: 8px 16px; margin-top: 12px; }
  #status { margin-top: 16px; padding: 10px; background: #f3f4f6; border-radius: 6px; }
</style>
</head>
<body>
<h2>Sample Course: Your Basics</h2>
<p>Answer 3 questions. Passing score is 60%. Your answers are saved, so close and reopen to test resume.</p>

<div class="q">1. What is your name?<br>
  <label><input type="radio" name="q1" value="ram"> Ram</label>
  <label><input type="radio" name="q1" value="shyam"> Shyam</label></div>
<div class="q">2. Where do you leave?<br>
  <label><input type="radio" name="q2" value="indore"> Indore</label>
  <label><input type="radio" name="q2" value="ujjain"> Ujjain</label></div>
<div class="q">3. What is your hobby<br>
  <label><input type="radio" name="q3" value="music"> Music</label>
  <label><input type="radio" name="q3" value="cricket"> Cricket</label></div>

<button onclick="submitQuiz()">Submit</button>
<button onclick="exitCourse()">Exit</button>
<div id="status">Connecting to LMS...</div>

<script>
// --- Find the SCORM 1.2 API by walking up parent windows (standard discovery) ---
function findAPI(win) {
  var tries = 0;
  while (win && !win.API && win.parent && win.parent !== win && tries++ < 10) win = win.parent;
  return win && win.API ? win.API : (window.opener && window.opener.API) || null;
}
var API = findAPI(window);
var answers = { q1: "b", q2: "a", q3: "b" };
var statusEl = document.getElementById("status");

function log(msg) { statusEl.textContent = msg; }

if (!API) {
  log("No SCORM API found. Open this course through the player page.");
} else {
  API.LMSInitialize("");
  var name = API.LMSGetValue("cmi.core.student_name") || "Learner";
  var prev = API.LMSGetValue("cmi.core.lesson_status");
  var saved = API.LMSGetValue("cmi.suspend_data");

  // Resume: restore saved answers
  if (saved) {
    try {
      var s = JSON.parse(saved);
      Object.keys(s).forEach(function (k) {
        var el = document.querySelector('input[name="' + k + '"][value="' + s[k] + '"]');
        if (el) el.checked = true;
      });
    } catch (e) {}
  }
  if (!prev || prev === "not attempted") API.LMSSetValue("cmi.core.lesson_status", "incomplete");
  API.LMSSetValue("cmi.core.lesson_location", "quiz");
  API.LMSCommit("");
  log("Hello " + name + ". Previous status: " + (prev || "not attempted"));

  // Save answers as learner clicks
  document.querySelectorAll("input[type=radio]").forEach(function (r) {
    r.addEventListener("change", function () {
      var s = {};
      ["q1", "q2", "q3"].forEach(function (q) {
        var c = document.querySelector('input[name="' + q + '"]:checked');
        if (c) s[q] = c.value;
      });
      API.LMSSetValue("cmi.suspend_data", JSON.stringify(s));
      API.LMSCommit("");
    });
  });
}

function submitQuiz() {
  if (!API) return;
  var correct = 0;
  Object.keys(answers).forEach(function (q) {
    var c = document.querySelector('input[name="' + q + '"]:checked');
    if (c && c.value === answers[q]) correct++;
  });
  var score = Math.round((correct / 3) * 100);
  API.LMSSetValue("cmi.core.score.raw", String(score));
  API.LMSSetValue("cmi.core.score.min", "0");
  API.LMSSetValue("cmi.core.score.max", "100");
  API.LMSSetValue("cmi.core.lesson_status", score >= 60 ? "passed" : "failed");
  API.LMSCommit("");
  log("Score: " + score + "% — " + (score >= 60 ? "Passed" : "Failed"));
}

function exitCourse() {
  if (!API) return;
  API.LMSSetValue("cmi.core.exit", "suspend");
  API.LMSFinish("");
  log("Course closed. Reload the player to test resume.");
}
</script>
</body>
</html>
